<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
        />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#262624" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <!-- Not black-translucent: that draws the page under the status bar, where iOS 26 blurs it. -->
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <title>Pi Pocket</title>
        <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
        <link rel="icon" href="/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="preload" href="/style.css" as="style" />
        <!--
            The cascade layers, in the order they win: the app's own CSS and extensions' (pocket), then the palette of the
            mode in use (palette, theme.js). The text size people choose stays inline and wins over both.
        -->
        <style>
            @layer pocket, palette;
            @import url("/style.css") layer(pocket);
        </style>
        <!--
            The last look this browser used (theme.js keeps it), before the first paint: no flash of the other mode.
        -->
        <script>
            (function () {
                try {
                    var look = JSON.parse(localStorage.getItem("pocket.themeCache") || "null");
                    var root = document.documentElement;
                    var mode = look && look.mode;
                    var light =
                        mode === "light" ||
                        (mode !== "dark" && matchMedia("(prefers-color-scheme: light)").matches);
                    root.dataset.mode = light ? "light" : "dark";
                    root.dataset.theme = "pocket";
                    root.dataset.tiling = "on";
                    if (look && look.pair) {
                        var chosen = look.pair[light ? "light" : "dark"];
                        var colors = "";
                        for (var name in chosen.palette)
                            colors += name + ":" + chosen.palette[name] + ";";
                        var palette = document.createElement("style");
                        palette.id = "pocket-palette";
                        palette.textContent = "@layer palette{:root{" + colors + "}}";
                        document.head.appendChild(palette);
                        document
                            .querySelector('meta[name="theme-color"]')
                            .setAttribute("content", chosen.color);
                    }
                    if (look && look.text) root.style.setProperty("--text-size", look.text);
                    if (look && look.sidebar) root.style.setProperty("--sidebar-w", look.sidebar);
                } catch (error) {}
            })();
        </script>
        <link rel="preload" href="/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin />
        <link
            rel="preload"
            href="/fonts/JetBrainsMono.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <script type="importmap">
            {
                "imports": {
                    "preact": "/vendor/preact.mjs",
                    "preact/hooks": "/vendor/preact-hooks.mjs",
                    "htm": "/vendor/htm.mjs",
                    "marked": "/vendor/marked.mjs",
                    "dompurify": "/vendor/purify.mjs"
                }
            }
        </script>
    </head>
    <body>
        <!-- The status bar's ground, in the window's color (style.css): iOS 26 takes the bar's color from it, not blurred. -->
        <div class="status-cover" aria-hidden="true"></div>
        <!-- The same boot screen the app shows while it starts (Boot in ui.js), so nothing jumps when the script takes over. -->
        <div id="app">
            <div class="boot" data-part="boot" role="status">
                <div class="boot-mark" data-part="brand-mark" aria-hidden="true">π</div>
                <div class="boot-bar" aria-hidden="true"><span></span></div>
                <div class="boot-caption">starting</div>
            </div>
        </div>
        <!--
            A file of the app that does not load (a content blocker, the network) or that fails as it runs stops the app
            before it can say so, and the boot screen stays up: say it here, until the app's script has run.
        -->
        <script>
            (function () {
                var fail = function (detail) {
                    var boot = document.querySelector("#app > .boot");

                    if (!boot) {
                        return;
                    }

                    // A signed-in page waits out its device-cache check hidden. A startup failure must still show.
                    boot.parentElement.hidden = false;
                    boot.classList.add("failed");
                    boot.querySelector(".boot-caption").textContent = "could not start";

                    var line = boot.querySelector(".boot-detail") || document.createElement("div");

                    line.className = "boot-detail";
                    line.textContent = detail;
                    boot.appendChild(line);
                };
                var watch = function (event) {
                    var target = event.target;
                    var app =
                        target &&
                        target.tagName === "SCRIPT" &&
                        target.getAttribute("src") === "/app.js";

                    if (event.type === "load") {
                        if (app) {
                            removeEventListener("error", watch, true);
                            document.removeEventListener("load", watch, true);
                        }
                    } else if (app) {
                        fail(
                            "A file of the app did not load. A content blocker can stop one: " +
                                "let this address through it, then reload.",
                        );
                    } else if (event instanceof ErrorEvent) {
                        fail(
                            "A file of the app failed: " + event.message + " Reload to try again.",
                        );
                    }
                };

                addEventListener("error", watch, true);
                document.addEventListener("load", watch, true);
            })();
        </script>
        <script type="module" src="/app.js"></script>
    </body>
</html>
